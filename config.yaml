# Konfiguracja klienta API ELI (ISAP) Sejmu RP

# Źródła
api_url: "https://api.sejm.gov.pl/eli"   # oficjalne API (źródło danych)
base_url: "https://isap.sejm.gov.pl"      # tylko do budowania linków do strony ISAP

# Wydawcy aktów prawnych do monitorowania
# DU = Dziennik Ustaw, MP = Monitor Polski
publishers:
  - DU
  - MP

# Zakres lat do pobrania (end: null = do bieżącego roku)
year_range:
  start: 2020   # Rok początkowy
  end: null     # null = do bieżącego roku

# Katalogi
data_dir: "data"
cache_dir: "data/cache"
logs_dir: "logs"
db_file: "data/acts_database.json"

# Monitorowanie
monitoring:
  enabled: true
  interval_hours: 24            # Sprawdzaj co 24 godziny
  notification_enabled: false   # Powiadomienia e-mail (wymaga konfiguracji SMTP)

# Limity i opóźnienia
rate_limiting:
  requests_per_second: 5    # API jest wydajne; 5 zapytań/s jest bezpieczne
  retry_attempts: 3
  retry_delay: 5            # sekundy

# Opcje pobierania
download:
  fetch_details: false   # true = dla każdego aktu dociągaj pełne szczegóły (wolniej, więcej zapytań)
  save_pdf: false        # (zarezerwowane) pobieranie tekstów PDF aktów
  save_metadata: true
